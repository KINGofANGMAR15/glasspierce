modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="glasspierce"
# ${file.jarVersion} из шаблонов MDK не используем: он конфликтует с processResources expand.
version="1.0.0"
displayName="TACZ Glass Piercing"
# Серверная сторона: клиенты БЕЗ этого мода могут подключаться к серверу С этим модом,
# и наоборот — мод на чистом клиенте без сервера не даёт эффекта (события только серверные).
displayTest="IGNORE_ALL_VERSION"
description='''
Extends TaCZ glass behavior: a bullet can pierce and shatter up to N glass blocks/panes
in a row (limit per caliber + attachment bonus), keeping the stock TaCZ break sound
and particles. Explosive ammo (RPG-7, 40mm, HE) is untouched. Server-side mod:
install on the server; in singleplayer just put it into mods.
'''
authors="KINGofANGMAR15"

[[dependencies.glasspierce]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.glasspierce]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# Жёсткая зависимость от TaCZ: оба механизма (event и mixin) работают на его событиях/классах.
[[dependencies.glasspierce]]
    modId="tacz"
    mandatory=true
    versionRange="[1.1.7,)"
    ordering="AFTER"
    side="BOTH"
